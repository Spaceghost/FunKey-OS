name: FunKey Iroh pre-merge hardware gate

on:
  pull_request:
    branches: [rg-nano-next, master]
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: funkey-iroh-pr-hardware
  cancel-in-progress: false

jobs:
  resolve-build:
    if: >-
      github.event.label.name == 'hardware-test' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}
    steps:
      - name: Resolve an exact green Iroh build for this PR head
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          head_sha = os.environ["HEAD_SHA"]
          pr_number = int(os.environ["PR_NUMBER"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          runs = get(
              f"https://api.github.com/repos/{repository}/actions/runs"
              f"?head_sha={head_sha}&event=pull_request&per_page=100"
          )["workflow_runs"]
          candidates = []
          for run in runs:
              if run.get("path") != ".github/workflows/iroh.yml":
                  continue
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  continue
              if run.get("head_sha") != head_sha:
                  continue
              pull_numbers = {item.get("number") for item in run.get("pull_requests", [])}
              if pr_number not in pull_numbers:
                  continue
              candidates.append(run)

          candidates.sort(key=lambda run: run.get("created_at", ""), reverse=True)
          for run in candidates:
              artifacts = get(run["artifacts_url"])["artifacts"]
              if any(
                  artifact.get("name") == "FunKey-OS Iroh firmware"
                  and not artifact.get("expired", False)
                  for artifact in artifacts
              ):
                  output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
                  with output.open("a", encoding="utf-8") as handle:
                      handle.write(f"build_run_id={run['id']}\n")
                  print(
                      f"Using Iroh build run {run['id']} for exact head {head_sha}"
                  )
                  break
          else:
              raise SystemExit(
                  "No successful, unexpired Iroh firmware build exists for "
                  f"PR #{pr_number} head {head_sha}. Remove the hardware-test label, "
                  "make software CI green, then apply the label again."
              )
          PY

  hardware:
    needs: resolve-build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/iroh-hardware-loop.yml
    with:
      build_run_id: ${{ needs.resolve-build.outputs.build_run_id }}
      device_host: 192.168.137.2
      log_prefix: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
    secrets: inherit
