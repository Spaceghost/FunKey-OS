name: FunKey-OS Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, rg-nano-next ]
  workflow_dispatch:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y -q --no-install-recommends make binutils build-essential cmake gcc g++ patch bzip2 perl cpio unzip rsync file bc wget python python-dev xxd libncurses5-dev cvs git mercurial rsync liblscp-dev subversion python3 python3-dev python3-distutils python3-setuptools ca-certificates openssh-client expect locales sudo procps
        sudo apt-get -y autoremove
        sudo apt-get -y clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo sed -i 's/# \(en_US.UTF-8\)/\1/' /etc/locale.gen
        sudo locale-gen --purge --lang en_US.UTF-8
    - name: Build both FunKey-OS USB profiles with Zig
      run: make -j"$(nproc)" zig-variants
    - uses: actions/upload-artifact@v4
      with:
        name: FunKey-OS firmware
        path: |
          images/*.fwu
          images/*.img.xz
          images/SHA256SUMS-*.txt
          images/packages-*.json
          images/packages-*.txt
          br.log
