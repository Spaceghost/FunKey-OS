name: FunKey-OS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, rg-nano-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Buildroot 2021.02 expects the GCC 9-era userspace from Focal, while the
    # retired ubuntu-20.04 runner label can no longer provide it directly.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # GitHub container jobs execute as root. GNU tar 1.29 deliberately
      # requires this opt-in before its host-tool configure step will run.
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
      - name: Install Focal build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y -q --no-install-recommends \
            bash bc binutils build-essential busybox bzip2 ca-certificates cmake cpio \
            cvs expect file gawk git gzip liblscp-dev libncurses5-dev locales \
            mercurial openssh-client patch perl procps python3 python3-dev \
            python3-distutils python3-setuptools rsync subversion tar unzip \
            wget xxd xz-utils
          ln -sfn /usr/bin/python3 /usr/local/bin/python
          locale-gen en_US.UTF-8
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Validate USB update and debug tooling
        run: |
          ./scripts/test-firmware-update
          ./scripts/test-usb-network-hotplug
          ./scripts/test-usb-menu-info
          ./scripts/test-usb-debug

      - name: Build production, network-only, and persistent USB-debug profiles with Zig
        run: |
          make -j"$(nproc)" zig-all
          ./scripts/build-usb-variants "$(make -s print-version)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FunKey-OS firmware
          if-no-files-found: warn
          path: |
            images/*.fwu
            images/*.img.xz
            images/SHA256SUMS-*.txt
            images/packages-*.json
            images/packages-*.txt
            br.log
