          write(
              "docs/usb-ssh-isolation.md",
              r'''# USB SSH isolation

Dropbear is bound only to `192.168.137.2:22`. Before it starts, firmware
installs a fail-closed IPv4 INPUT chain that accepts SSH only when all of the
following match:

- ingress interface `usb0`;
- peer address `192.168.137.1`;
- device address `192.168.137.2`;
- the host MAC assigned by the active RNDIS, ECM, or NCM gadget function.

The peer neighbor entry is pinned to that same MAC. A normal layer-2 bridge
preserves a frame's original source MAC, so another machine on the bridged LAN
cannot reach Dropbear. Standard and Iroh images additionally require public-key
authentication from `/mnt/FunKey/.ssh/authorized_keys`.

Only images whose name contains `usb-debug` inject the passwordless engineering
profile. They retain the same interface, address, and host-MAC gate.

No endpoint can distinguish a packet the directly attached host deliberately
re-originates itself. Host-side NAT, an SSH proxy, or a compromised host is
therefore inside the trust boundary; merely bridging the interface is not.
''',
