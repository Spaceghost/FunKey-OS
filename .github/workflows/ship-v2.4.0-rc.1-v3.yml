name: Ship v2.4.0-rc.1 source-verified

on:
  push:
    branches:
      - rc/v2.4.0-rc.1
    paths:
      - .github/workflows/ship-v2.4.0-rc.1-v3.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: ship-v2.4.0-rc.1
  cancel-in-progress: true

env:
  RELEASE_TAG: v2.4.0-rc.1
  RELEASE_VERSION: 2.4.0-rc.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/funkey-iroh
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  ship:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 360

    steps:
      - name: Install build and image-inspection dependencies
        run: |
          apt-get update
          apt-get install -y -q --no-install-recommends \
            bash bc binutils build-essential busybox bzip2 ca-certificates cmake \
            cpio curl cvs dash e2fsprogs expect fdisk file gawk git gzip \
            liblscp-dev libncurses5-dev libsdl1.2-dev libsdl-ttf2.0-dev locales \
            mercurial openssh-client patch perl procps python3 python3-dev \
            python3-distutils python3-setuptools rsync subversion tar unzip \
            util-linux wget xxd xz-utils
          ln -sfn /usr/bin/python3 /usr/local/bin/python
          locale-gen en_US.UTF-8
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          ref: rc/v2.4.0-rc.1
          fetch-depth: 0
          submodules: recursive

      - name: Trust checkout and set release identity
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            download
          key: funkey-rc-v2.4.0-rc.1-${{ runner.os }}-${{ hashFiles('tools/funkey-iroh/Cargo.lock', 'FunKey/configs/funkey_defconfig') }}
          restore-keys: |
            funkey-iroh-source-${{ runner.os }}-
            funkey-rc-v2.4.0-rc.1-${{ runner.os }}-

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: arm-unknown-linux-musleabihf

      - name: Source-test, harden, build, verify, tag, and publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/prepare-usb-peer-ssh-rc-v3

      - name: Preserve exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2.4.0-rc.1-source-verified-release-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            RELEASE-PUBLISHED.env
            release-assets/
            images/SHA256SUMS-2.4.0-rc.1-iroh*.txt
            br.log
