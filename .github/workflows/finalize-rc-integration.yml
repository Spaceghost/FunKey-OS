name: Finalize RC integration

on:
  push:
    branches: [rc/v2.4.0-rc.1]
    paths: [.github/workflows/finalize-rc-integration.yml]

permissions:
  contents: write

concurrency:
  group: finalize-v2.4.0-rc.1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/v2.4.0-rc.1
          fetch-depth: 0
          submodules: false

      - name: Patch the hardened builder with the launcher augmentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/build-iroh-variant')
          text = path.read_text()

          old = '''    "${ui_libs[@]}" \\
              -o "$ui_binary"
          '''
          new = '''    "${ui_libs[@]}" \\
              -lSDL_ttf -lasound -lm \\
              -o "$ui_binary"
          '''
          if old not in text:
              raise SystemExit('UI linker anchor not found')
          text = text.replace(old, new, 1)

          old = '''write $ui_opk /usr/local/share/OPKs/Libretro/funkey-iroh-ui.opk
          EOF

          if [[ -n "$usb_profile" ]]; then
          '''
          new = '''write $ui_opk /usr/local/share/OPKs/Libretro/funkey-iroh-ui.opk
          EOF

          # Add pairing, inbox/outbox, post-game sync, and pre-game launch hooks
          # without replacing the hardened transport/debug variant builder.
          . "$repo/scripts/augment-iroh-ui-rootfs" prepare

          if [[ -n "$usb_profile" ]]; then
          '''
          if old not in text:
              raise SystemExit('rootfs command anchor not found')
          text = text.replace(old, new, 1)

          old = '''dump_and_compare "$funkey_rootfs" /usr/local/share/OPKs/Libretro/funkey-iroh-ui.opk \\
              "$ui_opk" opk

          for image in "$funkey_rootfs" "$recovery_rootfs"; do
          '''
          new = '''dump_and_compare "$funkey_rootfs" /usr/local/share/OPKs/Libretro/funkey-iroh-ui.opk \\
              "$ui_opk" opk
          . "$repo/scripts/augment-iroh-ui-rootfs" verify

          for image in "$funkey_rootfs" "$recovery_rootfs"; do
          '''
          if old not in text:
              raise SystemExit('rootfs verification anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          chmod 0755 scripts/augment-iroh-ui-rootfs
          bash -n \
            scripts/build-iroh-variant \
            scripts/augment-iroh-ui-rootfs \
            scripts/test-iroh-ui

          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends busybox dash
          test_runtime="$RUNNER_TEMP/funkey-iroh-runtime"
          mkdir -p "$test_runtime"
          FUNKEY_IROH_RUNTIME_DIR="$test_runtime" \
          FUNKEY_IROH_ENDPOINT_LOCK="$RUNNER_TEMP/funkey-iroh-endpoint.lock" \
            ./scripts/test-iroh-ui

          grep -q 'augment-iroh-ui-rootfs.*prepare' scripts/build-iroh-variant
          grep -q 'augment-iroh-ui-rootfs.*verify' scripts/build-iroh-variant
          grep -q -- '-lSDL_ttf -lasound -lm' scripts/build-iroh-variant

          rm .github/workflows/finalize-rc-integration.yml
          git add -A
          git diff --cached --check
          git commit -m 'build: integrate the launcher lifecycle into hardened Iroh variants'
          git push origin HEAD:rc/v2.4.0-rc.1
