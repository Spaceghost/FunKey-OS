name: FunKey-OS Iroh Build

on:
  pull_request:
    branches: [ rg-nano-next ]
    paths:
      - '.github/workflows/iroh.yml'
      - 'docs/iroh.md'
      - 'scripts/build-iroh-firmware'
      - 'scripts/build-iroh-variant'
      - 'tools/funkey-iroh/**'
  workflow_dispatch:

concurrency:
  group: funkey-iroh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Buildroot 2021 needs the Focal userspace, but GitHub retired the
    # ubuntu-20.04 runner label. Run that userspace inside a current host.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
    - name: Install Focal firmware build dependencies
      run: |
        apt-get update
        apt-get install -y -q --no-install-recommends \
          bash bc binutils build-essential busybox bzip2 ca-certificates cmake \
          cpio curl cvs expect file gawk git gzip liblscp-dev libncurses5-dev locales \
          mercurial openssh-client patch perl procps python3 python3-dev \
          python3-distutils python3-setuptools rsync subversion tar unzip wget \
          xxd xz-utils
        ln -sfn /usr/bin/python3 /usr/local/bin/python
        locale-gen en_US.UTF-8
        rm -rf /var/lib/apt/lists/*

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Trust the container-mounted checkout
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - uses: dtolnay/rust-toolchain@1.91.0
      with:
        targets: armv7-unknown-linux-musleabihf

    - name: Show pinned toolchains
      run: |
        rustc --version
        cargo --version
        zig version

    - name: Validate scripts
      run: |
        bash -n scripts/build-iroh-firmware scripts/build-iroh-variant
        dash -n \
          tools/funkey-iroh/target-rootfs/etc/init.d/S44funkey-iroh \
          tools/funkey-iroh/target-rootfs/usr/bin/funkey-iroh-service

    - name: Build Iroh firmware variant
      run: ./scripts/build-iroh-firmware

    - name: Run native protocol and state tests
      run: |
        cargo test \
          --manifest-path tools/funkey-iroh/Cargo.toml \
          --locked

    - name: Inspect target executable
      run: |
        binary=.cargo-target/funkey-iroh/armv7-unknown-linux-musleabihf/release/funkey-iroh
        file "$binary"
        readelf -h "$binary"
        if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
          echo "target executable is dynamically linked" >&2
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: FunKey-OS Iroh firmware
        if-no-files-found: error
        path: |
          images/FunKey-rootfs-*-iroh.fwu
          images/FunKey-sdcard-*-iroh.img.xz
          images/SHA256SUMS-*-iroh.txt
          images/iroh-*.json
          tools/funkey-iroh/Cargo.lock
          .cargo-target/funkey-iroh/armv7-unknown-linux-musleabihf/release/funkey-iroh
          br.log
