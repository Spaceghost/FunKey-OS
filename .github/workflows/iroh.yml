name: FunKey-OS Iroh Build

on:
  pull_request:
    branches: [rg-nano-next, feature/iroh-save-netplay]
    paths:
      - '.github/workflows/iroh.yml'
      - 'docs/iroh.md'
      - 'docs/iroh-ui.md'
      - 'scripts/build-iroh-firmware'
      - 'scripts/build-iroh-variant'
      - 'scripts/test-iroh-ui'
      - 'tools/funkey-iroh/**'
      - 'tools/funkey-iroh-ui/**'
  workflow_dispatch:

concurrency:
  group: funkey-iroh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Buildroot 2021 needs the Focal userspace, but GitHub retired the
    # ubuntu-20.04 runner label. Run that userspace inside a current host.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
      - name: Install Focal firmware build dependencies
        run: |
          apt-get update
          apt-get install -y -q --no-install-recommends \
            bash bc binutils build-essential busybox bzip2 ca-certificates cmake \
            cpio curl cvs dash expect file gawk git gzip liblscp-dev \
            libncurses5-dev locales mercurial openssh-client patch perl procps \
            python3 python3-dev python3-distutils python3-setuptools rsync \
            subversion tar unzip wget xxd xz-utils
          ln -sfn /usr/bin/python3 /usr/local/bin/python
          locale-gen en_US.UTF-8
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust the container-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Show pinned toolchains
        run: |
          rustc --version
          cargo --version
          zig version

      - name: Validate UI and helper policy
        run: ./scripts/test-iroh-ui

      - name: Lock and test the native daemon
        run: |
          cargo generate-lockfile \
            --manifest-path tools/funkey-iroh/Cargo.toml
          cargo test \
            --manifest-path tools/funkey-iroh/Cargo.toml \
            --locked

      - name: Build Iroh firmware and launcher UI
        run: ./scripts/build-iroh-firmware

      - name: Inspect target executables
        run: |
          daemon=.cargo-target/funkey-iroh/armv7-unknown-linux-musleabihf/release/funkey-iroh
          ui=$(find images -maxdepth 1 -type f -name 'funkey-iroh-ui-*-iroh' -print -quit)
          test -n "$ui"
          file "$daemon" "$ui"
          readelf -h "$daemon"
          readelf -h "$ui"
          if readelf -d "$daemon" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "Iroh daemon is dynamically linked" >&2
            exit 1
          fi
          readelf -d "$ui" | grep -q 'libSDL'
          readelf -d "$ui" | grep -q 'libSDL_ttf'

      - uses: actions/upload-artifact@v4
        with:
          name: FunKey-OS Iroh UI firmware
          if-no-files-found: error
          path: |
            images/FunKey-rootfs-*-iroh.fwu
            images/FunKey-sdcard-*-iroh.img.xz
            images/SHA256SUMS-*-iroh.txt
            images/iroh-*.json
            images/funkey-iroh-ui-*-iroh
            images/iroh-ui-*-iroh.opk
            tools/funkey-iroh/Cargo.lock
            .cargo-target/funkey-iroh/armv7-unknown-linux-musleabihf/release/funkey-iroh
            br.log
