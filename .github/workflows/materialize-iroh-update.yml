name: Materialize Iroh UI and portability update

on:
  push:
    branches: [feature/iroh-save-netplay]
    paths: ['.github/workflows/materialize-iroh-update.yml']

permissions:
  contents: write

concurrency:
  group: materialize-iroh-update
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Merge debug foundation and install reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin rg-nano-next
          git merge --no-edit origin/rg-nano-next

          cat .iroh-update-payload/*.part > /tmp/iroh-update.tar.gz.b64
          base64 -d /tmp/iroh-update.tar.gz.b64 > /tmp/iroh-update.tar.gz
          echo '3975acf78c8a9da22232de1bcc9e7f7bcf60ac46beb75387b3a532581d45a615  /tmp/iroh-update.tar.gz' | sha256sum -c -
          tar -xzf /tmp/iroh-update.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .iroh-update-payload

          if git diff --name-only origin/feature/iroh-save-netplay -- .github/workflows | grep -q .; then
            echo 'materializer would alter a workflow file; refusing token-hostile push' >&2
            git diff --name-only origin/feature/iroh-save-netplay -- .github/workflows >&2
            exit 1
          fi

          git add -A
          git commit -m 'feat: add portable games, savestates, UI, and release gates'
          git push origin HEAD:"$GITHUB_REF_NAME"
