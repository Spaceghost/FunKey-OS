[package]
name = "funkey-iroh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-2.0-or-later"
description = "Iroh save sharing and UDP netplay transport for FunKey-OS"

[dependencies]
anyhow = "1.0"
blake3 = { version = "1.8.3", default-features = false, features = ["std"] }
bytes = "1.11"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
tokio = { version = "=1.47.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "time",
] }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = "fat"
debug = 0
strip = "symbols"
